- type: entity
  parent: BaseItem
  id: StellarScienceDataDrive
  name: data drive
  description: A heavy-duty drive, used for storing and processing hazard data.
  categories: [ ForkFiltered ]
  components:
  - type: StellarDataDrive
  - type: Sprite
    sprite: _ST/Items/Science/data-drive.rsi
    layers:
    - state: icon-empty
      map: [ "base" ]
    - state: icon-unshaded
      map: [ "unshaded" ]
      visible: False
      shader: unshaded
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.StellarDataDriveVisuals.Visuals:
        base:
          1: { state: icon-empty }
          2: { state: icon }
          3: { state: icon-depleted }
        unshaded:
          1: { visible: false }
          2: { visible: true }
          3: { visible: false }

- type: entity
  parent: StellarScienceDataDrive
  id: StellarScienceDataDriveFull
  description: A heavy-duty drive, used for storing and processing hazard data.
  categories: [ ForkFiltered ]
  components:
  - type: Sprite
    layers:
    - state: icon
    - state: icon-unshaded
      shader: unshaded
  - type: StellarDataDrive
    full: true

- type: entity
  parent: BaseItem
  id: StellarScienceCapsule
  name: containment capsule
  description: A heavy-duty capsule, used for the containment of stabilized anomalies.
  categories: [ ForkFiltered ]
  components:
  - type: StellarContainmentCapsule
  - type: Sprite
    noRot: true
    drawdepth: Mobs
    sprite: _ST/Items/Science/containment-capsule.rsi
    layers:
    - state: icon-empty
      map: [ "base" ]
    - state: icon-unshaded
      map: [ "unshaded" ]
      visible: False
      shader: unshaded
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.StellarCapsuleVisuals.Visuals:
        base:
          1: { state: icon-empty }
          2: { state: icon }
          3: { state: icon-depleted }
        unshaded:
          1: { visible: false }
          2: { visible: true }
          3: { visible: false }
