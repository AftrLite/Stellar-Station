- type: entity
  parent: StellarWeaponGorlexBase
  id: StellarWeaponGorlexCerberus
  name: Cerberus IV
  components:
  - type: Sprite
    sprite: _ST/Items/Weapons/Guns/echion-cerberus.rsi
  - type: Appearance
  - type: MagazineVisuals
  - type: Item
    sprite: _ST/Items/Weapons/Guns/echion-cerberus.rsi
    size: Small
    shape:
    - 0,0,1,1
  - type: Gun
    cameraRecoilScalar: 2.375
    minAngle: 0
    maxAngle: 8
    fireRate: 1.41
    angleIncrease: 2
    angleDecay: 8
    selectedMode: SemiAuto
    availableModes:
    - SemiAuto
    soundGunshot:
      path: /Audio/_ST/Weapons/Guns/echion-cerberus.ogg
      params:
        variation: 0.1
  - type: StellarGunCrosshair
    rsi:
      sprite: _ST/Interface/Crosshair/echion-cursor.rsi
      state: cerberus
  - type: StellarGunReloadable
    shootable: StellarHitscanEchionCerberus
    muzzleFlash: StellarMuzzleFlashEchionHeavy
    ammoMaxReserves: 10
    ammoMagCapacity: 10

