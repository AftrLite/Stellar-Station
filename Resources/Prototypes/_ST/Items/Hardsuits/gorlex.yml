- type: entity
  parent: StellarHardsuitBase
  id: StellarHardsuitGorlexInfiltrator
  name: Kerynitis "Infiltrator" hardsuit
  description: LOREM IPSUM
  categories: [ ForkFiltered ]
  components:
  - type: SlotBlock
    slots: [innerclothing, feet, gloves]
  - type: Sprite
    sprite: _ST/Items/Hardsuit/gorlex-infiltrator.rsi
  - type: Clothing
    sprite: _ST/Items/Hardsuit/gorlex-infiltrator.rsi
  - type: PressureProtection
    highPressureMultiplier: 0.2
    lowPressureMultiplier: 1000
  - type: ExplosionResistance
    damageCoefficient: 0.2
  # - type: StaminaResistance # Should not have stamina resistance, this is purely so people know it was not forgotten.
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.2
        Slash: 0.2
        Piercing: 0.2
        Heat: 0.2
        Radiation: 0.2
        Caustic: 0.2
  - type: ClothingSpeedModifier
    walkModifier: 1
    sprintModifier: 0.9
  - type: HeldSpeedModifier
  - type: ToggleableClothing
    clothingPrototype: StellarHardsuitHelmetGorlexInfiltrator
  - type: FootstepModifier
    footstepSoundCollection:
      collection: FootstepCatwalk

