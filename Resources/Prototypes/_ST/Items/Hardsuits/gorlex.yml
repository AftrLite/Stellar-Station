- type: entity
  parent: StellarHardsuitHelmetBaseUnshaded
  id: StellarHardsuitHelmetGorlexInfiltrator
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _ST/Items/Hardsuit/gorlex-infiltrator.rsi
  - type: Clothing
    sprite: _ST/Items/Hardsuit/gorlex-infiltrator.rsi
  - type: PressureProtection
    highPressureMultiplier: 0.3
    lowPressureMultiplier: 1000
  - type: PointLight
    enabled: true
    color: "#83db2b"
    radius: 4
    energy: 2
    mask: /Textures/Effects/LightMasks/cone.png
    castShadows: false
    autoRot: true
    netsync: false

