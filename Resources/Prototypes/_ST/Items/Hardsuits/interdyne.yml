- type: entity
  parent: StellarHardsuitBase
  id: StellarHardsuitInterdyneOperative
  name: LOREM IPSUM
  description: LOREM IPSUM
  suffix: empowered
  categories: [ ForkFiltered ]
  components:
  - type: SlotBlock
    slots: [innerclothing, feet, gloves]
  - type: Sprite
    sprite: _ST/Items/Hardsuit/interdyne-operative.rsi
  - type: Clothing
    sprite: _ST/Items/Hardsuit/interdyne-operative.rsi
  - type: PressureProtection
    highPressureMultiplier: 0.2
    lowPressureMultiplier: 1000
  - type: ExplosionResistance
    damageCoefficient: 0.2
  # - type: StaminaResistance # Should not have stamina resistance, this is purely so people know it was not forgotten.
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.2
        Slash: 0.2
        Piercing: 0.2
        Heat: 0.2
        Radiation: 0.2
        Caustic: 0.2
  - type: ToggleableClothing
    clothingPrototype: StellarHardsuitHelmetInterdyneOperative
  - type: FootstepModifier
    footstepSoundCollection:
      collection: FootstepCatwalk

- type: entity
  parent: StellarHardsuitHelmetBaseUnshaded
  id: StellarHardsuitHelmetInterdyneOperative
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _ST/Items/Hardsuit/interdyne-operative.rsi
  - type: Clothing
    sprite: _ST/Items/Hardsuit/interdyne-operative.rsi
  - type: PressureProtection
    highPressureMultiplier: 0.3
    lowPressureMultiplier: 1000
  - type: PointLight
    mask: /Textures/Effects/LightMasks/cone.png
    enabled: true
    color: "#69d8ff"
    radius: 4
    energy: 2
    castShadows: false
    autoRot: true
    netsync: false
