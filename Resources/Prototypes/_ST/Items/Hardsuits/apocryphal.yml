- type: entity
  parent: StellarHardsuitBase
  id: StellarHardsuitApocryphal
  name: apocryphal robes
  description: LOREM IPSUM
  categories: [ ForkFiltered ]
  components:
  - type: SlotBlock
    slots: [innerclothing, feet, gloves]
  - type: Sprite
    sprite: _ST/Items/Hardsuit/apocryphal-robes.rsi
  - type: Clothing
    sprite: _ST/Items/Hardsuit/apocryphal-robes.rsi
  - type: PressureProtection
    highPressureMultiplier: 0.2
    lowPressureMultiplier: 1000
  - type: ExplosionResistance
    damageCoefficient: 0.2
  # - type: StaminaResistance # Should not have stamina resistance, this is purely so people know it was not forgotten.
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.2
        Slash: 0.2
        Piercing: 0.2
        Heat: 0.2
        Radiation: 0.2
        Caustic: 0.2
  - type: ToggleableClothing
    clothingPrototype: StellarHardsuitHelmetApocryphal
  - type: FootstepModifier
    footstepSoundCollection:
      collection: FootstepCatwalk

- type: entity
