- type: entity
  parent: StellarHardsuitHelmetBase
  id: StellarHardsuitHelmetApocryphal
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _ST/Items/Hardsuit/apocryphal-robes.rsi
  - type: Clothing
    sprite: _ST/Items/Hardsuit/apocryphal-robes.rsi
  - type: PressureProtection
    highPressureMultiplier: 0.3
    lowPressureMultiplier: 1000

- type: entity
  parent: StellarHardsuitHelmetBaseUnshaded
  id: StellarHardsuitHelmetApocryphalEmpowered
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _ST/Items/Hardsuit/apocryphal-robes-empowered.rsi
  - type: Clothing
    sprite: _ST/Items/Hardsuit/apocryphal-robes-empowered.rsi
  - type: PressureProtection
    highPressureMultiplier: 0.3
    lowPressureMultiplier: 1000
  - type: PointLight
    enabled: true
    color: "#00ffce"
    radius: 2
    energy: 3
    castShadows: false
    autoRot: true
    netsync: false
