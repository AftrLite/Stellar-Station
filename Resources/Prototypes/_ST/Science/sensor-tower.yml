- type: entity
  parent: StellarStructureBase
  id: StellarScienceSensorTower
  name: sensor tower
  categories: [ ForkFiltered ]
  components:
  - type: StellarSensorTower
  - type: InteractionOutline
  - type: SpriteFade
  - type: Sprite
    drawdepth: Mobs
    noRot: true
    offset: 0, 1
    sprite: _ST/Tileset/Science/sensor-tower.rsi
    layers:
    - state: base
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.6,-0.3,0.6,0.6"
        density: 1000
        mask:
        - MachineMask
        layer:
        - GlassAirlockLayer
  - type: UserInterface
    interfaces:
      enum.StellarSensorTowerRadialKey.Key:
        type: StellarSensorTowerBoundUserInterface
  - type: AmbientSound
    enabled: false
    volume: +12
    range: 4
    sound:
      path: /Audio/_ST/Machines/ringtone.ogg

- type: entity
  parent: StellarStructureBase
  id: StellarScienceSensorTerminal
  name: sensor network terminal
  categories: [ ForkFiltered ]
  components:
  - type: StellarSensorTerminal
  - type: InteractionOutline
  - type: Sprite
    offset: 0, 0.09375
    drawdepth: Mobs
    noRot: true
    sprite: _ST/Tileset/Science/sensor-terminal.rsi
    layers:
    - state: shadow
      offset: 0, -0.0625
    - state: base
    - state: unshaded
      shader: unshaded
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.4,-0.01,0.4,0.4"
        density: 1000
        mask:
        - MachineMask
        layer:
        - GlassAirlockLayer
  - type: AmbientSound
    enabled: false
    volume: +12
    range: 10
    sound:
      path: /Audio/_ST/Machines/ringtone.ogg
  - type: Speech
    speechVerb: Robotic
    speechSounds: Borg
    speechBubbleOffset: 0.2
