- type: entity
  parent: StellarStructureBase
  id: StellarScienceSensorTower
  name: sensor tower
  description: Part of the station's external sensor arrays. Processes hazard data when loaded with a data drive and synchronized with the main sensor network.
  categories: [ ForkFiltered ]
  components:
  - type: StellarSensorTower
  - type: InteractionOutline
  - type: DoAfter
  - type: SpriteFade
  - type: Sprite
    drawdepth: Mobs
    noRot: true
    offset: 0, 1
    sprite: _ST/Tileset/Science/sensor-tower.rsi
    layers:
    - state: base
      map: [ "base" ]
    - state: unshaded
      map: [ "unshaded" ]
      sprite: _ST/Tileset/Science/sensor-tower-extras.rsi
      shader: unshaded
      offset: -0.03125, -0.90625
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.StellarSensorTowerVisuals.Visuals:
        base:
          1: { state: base }
          2: { state: base-damaged }
        unshaded:
          1: { state: unshaded }
          2: { state: unshaded-damaged }
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.6,-0.3,0.6,0.6"
        density: 1000
        mask:
        - MachineMask
        layer:
        - GlassAirlockLayer
  - type: UserInterface
    interfaces:
      enum.StellarSensorTowerRadialKey.Key:
        type: StellarSensorTowerBoundUserInterface
  - type: AmbientSound
    enabled: false
    volume: +12
    range: 4
    sound:
      path: /Audio/_ST/Science/science-tower-ringtone.ogg
  - type: RandomMetadata
    nameSegments:
    - StellarSensorTowerNames
    nameFormat: name-format-sensortower
  - type: Weldable
    weldedExamineMessage: null
    fuel: 15
    time: 7.5
