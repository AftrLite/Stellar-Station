- type: entity
  parent: StellarStructureBase
  id: StellarScienceSensorTower
  name: sensor tower
  description: Part of the station's external sensor arrays. Processes hazard data when loaded with a data drive and synchronized with the main sensor network.
  categories: [ ForkFiltered ]
  components:
  - type: StellarSensorTower
  - type: InteractionOutline
  - type: DoAfter
  - type: SpriteFade
  - type: Sprite
    drawdepth: Mobs
    noRot: true
    offset: 0, 1
    sprite: _ST/Tileset/Science/sensor-tower.rsi
    layers:
    - state: base
    - state: unshaded
      sprite: _ST/Tileset/Science/sensor-tower-extras.rsi
      shader: unshaded
      offset: -0.03125, -0.90625
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.6,-0.3,0.6,0.6"
        density: 1000
        mask:
        - MachineMask
        layer:
        - GlassAirlockLayer
  - type: UserInterface
    interfaces:
      enum.StellarSensorTowerRadialKey.Key:
        type: StellarSensorTowerBoundUserInterface
  - type: AmbientSound
    enabled: false
    volume: +12
    range: 4
    sound:
      path: /Audio/_ST/Machines/ringtone.ogg
  - type: EmitSoundOnUIOpen
    sound:
      collection: Keyboard
      params:
        volume: -1
        variation: 0.10
        pitch: 1.10  # low pitch keyboard sounds feel kinda weird
  - type: RandomMetadata
    nameSegments:
    - StellarSensorTowerNames
    nameFormat: name-format-sensortower

- type: entity
  parent: StellarStructureBase
  id: StellarScienceSensorTerminal
  name: sensor network terminal
  description: This terminal is used to synchronize the station's external sensor towers. Useful!
  categories: [ ForkFiltered ]
  components:
  - type: StellarSensorTerminal
  - type: InteractionOutline
  - type: Sprite
    offset: 0.5, 0.09375
    drawdepth: Mobs
    noRot: true
    sprite: _ST/Tileset/Science/sensor-terminal.rsi
    layers:
    - state: shadow
      offset: 0, -0.0625
    - state: base
    - state: unshaded
      shader: unshaded
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.4,-0.01,1.4,0.4"
        density: 1000
        mask:
        - MachineMask
        layer:
        - GlassAirlockLayer
  - type: AmbientSound
    enabled: false
    volume: +12
    range: 10
    sound:
      path: /Audio/_ST/Machines/ringtone.ogg
  - type: Speech
    speechVerb: Robotic
    speechSounds: Borg
    speechBubbleOffset: 0.2

- type: entity
  parent: BaseItem
  id: StellarScienceDataDrive
  name: data drive
  description: A heavy-duty drive, used for storing and processing hazard data.
  categories: [ ForkFiltered ]
  components:
  - type: Sprite
    sprite: _ST/Items/Science/data-drive.rsi
    noRot: true
    layers:
    - state: icon-empty
  - type: StellarDataDrive

- type: entity
  parent: StellarScienceDataDrive
  id: StellarScienceDataDriveFull
  description: A heavy-duty drive, used for storing and processing hazard data.
  categories: [ ForkFiltered ]
  components:
  - type: Sprite
    layers:
    - state: icon
    - state: icon-unshaded
      shader: unshaded
  - type: StellarDataDrive
    full: true
