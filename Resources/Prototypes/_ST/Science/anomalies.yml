- type: entity
  abstract: true
  parent: StellarStructureBase
  id: StellarScienceAnomalyBase
  name: Anomaly
  components:
  - type: StellarAnomaly
#    pipTimeMin: 5
#    pipTimeMax: 10
    harvestOutput: StellarScienceDataDrive
    harvestOutputRare: StellarScienceDataDriveFull
    soundSpawn:
      path: /Audio/_ST/Science/science-anom-spawn.ogg
      params:
        variation: 0.077
    soundPulse:
      path: /Audio/_ST/Science/science-anom-pulse.ogg
      params:
        variation: 0.077
  - type: InteractionOutline
  - type: Sprite
    drawdepth: Mobs
    sprite: _ST/Effects/anomalies.rsi
  - type: Appearance
  - type: AnimationPlayer
  - type: ESTimedDespawnSpriteFade
    fadeTime: 0.8
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.35
        density: 50
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: AmbientSound
    enabled: false
    range: 15
    sound:
      path: /Audio/_ST/Science/science-anom-idle.ogg
  - type: PointLight
    enabled: false
    radius: 3.75
    energy: 9
    softness: 2
    color: "#00ccff"
    castShadows: true


- type: entity
  abstract: true
  parent: StellarScienceAnomalyBase
  id: StellarScienceAnomalyPowerfulBase
  components:
  - type: StellarAnomaly
    integrityPipsMax: 7
    integrityPipsSpawnVariance: 3
    pipTimeMin: 60
    pipTimeMax: 120
    pipTimeStable: 140

- type: entity
  parent: StellarScienceAnomalyBase
  id: StellarScienceAnomalyBluespace
  description: An unbound vortex of swirling cerulean...
  suffix: Bluespace
  components:
  - type: Sprite
    layers:
    - state: shadow-anomaly
      shader: unshaded
    - state: bluespace-1
      shader: unshaded
  - type: PointLight
    radius: 2.0
    energy: 5.5
    softness: 4
    color: "#27adbd"
    castShadows: false
  - type: Portal
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.35
        density: 50
        mask:
        - MobMask
        layer:
        - MobLayer
      portalFixture:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.25,-0.48,0.25,0.48"
        mask:
        - FullTileMask
        layer:
        - WallLayer
        hard: false

- type: entity
  parent: StellarScienceAnomalyPowerfulBase
  id: StellarScienceAnomalyAzure
  description: A maelstrom pure azure, seething against realspace.
  suffix: Azure
  components:
  - type: StellarAnomaly
    triggerChance: 0.75
  - type: SpawnOnTrigger
    keysIn:
    - anom
    proto: StellarSciencBluespaceRift
  - type: Sprite
    layers:
    - state: shadow-anomaly
      shader: unshaded
    - state: bluespace-2
      shader: unshaded
  - type: PointLight
    radius: 2.0
    energy: 5.5
    softness: 4
    color: "#468aff"
    castShadows: false
  - type: ExplodeOnTrigger
    keysIn:
    - anom
  - type: Explosive
    explosionType: StellarDefault
    maxIntensity: 5
    intensitySlope: 2
    totalIntensity: 35
    canCreateVacuum: false
    repeatable: true
    deleteAfterExplosion: false
  - type: Portal
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.35
        density: 50
        mask:
        - MobMask
        layer:
        - MobLayer
      portalFixture:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.25,-0.48,0.25,0.48"
        mask:
        - FullTileMask
        layer:
        - WallLayer
        hard: false

- type: entity
  parent: StellarScienceAnomalyBase
  id: StellarScienceAnomalyShadow
  description: An unbound fissure in the fabric of reality...
  suffix: Shadow
  components:
  - type: Sprite
    layers:
    - state: shadow-anomaly
      shader: unshaded
    - state: shadow-1
      offset: 0, 0.1
      shader: unshaded
  - type: PointLight
    radius: 2.0
    energy: 5.5
    softness: 4
    color: "#6a4db4"
    castShadows: false

- type: entity
  parent: StellarScienceAnomalyPowerfulBase
