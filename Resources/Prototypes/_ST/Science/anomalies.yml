    castShadows: false

- type: entity
  parent: StellarScienceAnomalyBase
  id: StellarScienceAnomalyElectric
  description: An unbound arc of pure energy...
  suffix: Electric
  components:
  - type: StellarAnomaly
    soundPulse:
      path: /Audio/_ST/Science/science-anom-pulse-electric.ogg
      params:
        variation: 0.077
  - type: Sprite
    layers:
    - state: shadow-anomaly
      shader: unshaded
    - state: electric-1
      offset: 0, 0.2
      shader: unshaded
  - type: PointLight
    radius: 2.0
