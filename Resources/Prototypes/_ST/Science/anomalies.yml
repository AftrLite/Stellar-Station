- type: entity
  abstract: true
  parent: StellarStructureBase
  id: StellarScienceAnomalyBase
  name: Anomaly
  components:
  - type: StellarAnomaly
  - type: InteractionOutline
  - type: Sprite
    drawdepth: Mobs
    sprite: _ST/Effects/anomalies.rsi
    layers:
    - state: shadow-anomaly
      shader: unshaded
    - state: shadow-anomaly
      shader: unshaded
  - type: Appearance
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.35
        density: 50
        mask:
        - FlyingMobMask
        layer:
        - FlyingMobLayer
  - type: PointLight
    radius: 2.0
    energy: 5.5
    softness: 4
    color: "#00ccff"
    castShadows: false
  - type: LightBehaviour
    behaviours:
    - !type:RandomizeBehaviour
      id: fade_out
      interpolate: Cubic
      minDuration: 0.2
      maxDuration: 0.3
      startValue: 5.5
      endValue: 2.625
      property: Energy
      isLooped: true
      enabled: true
    - !type:FadeBehaviour
      id: fade_out
      maxDuration: 4.0
      startValue: 2.5
      endValue: 1.75
      isLooped: true
      enabled: true
      reverseWhenFinished: true

