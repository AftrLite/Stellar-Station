- type: entity
  parent: StellarScienceAnomalyBase
  id: StellarScienceAnomalyFlesh
  description: An unbound amalgam of flesh and tissue...
  suffix: Flesh
  components:
  - type: Sprite
    layers:
    - state: shadow-anomaly
      shader: unshaded
    - state: flesh
      shader: unshaded
  - type: PointLight
    radius: 2.0
    energy: 5.5
    softness: 4
    color: "#ac4060"
    castShadows: false
  - type: StellarAnomalyPulseSpawn
    entries:
    - settings:
        minAmount: 6
        maxAmount: 8
        maxRange: 3.5
        canSpawnOnEntities: false
      spawns:
      - StellarFleshFloor
    - settings:
        spawnOnPulse: true
        minAmount: 1
        maxAmount: 3
        minRange: 3
        maxRange: 4.5
      spawns:
      - MobFleshJared
      - MobFleshGolem
      - MobFleshClamp
      - MobFleshLover

- type: entity
  parent: StellarScienceAnomalyBase
  id: StellarScienceAnomalyOoze
  description: An unbound blob of unidentifiable ooze...
  suffix: Ooze
  components:
  - type: StellarAnomaly
    triggerChance: 1
  - type: Sprite
    layers:
    - state: shadow-anomaly
      shader: unshaded
    - state: ooze
      shader: unshaded
  - type: PointLight
    radius: 2.0
    energy: 5.5
    softness: 4
    color: "#7acc62"
    castShadows: false
  - type: StellarAnomalyPulseSpawn
    spawnOnSpawn: false
    entries:
    - settings:
        minAmount: 0
        maxAmount: 2
        minRange: 1
        maxRange: 4
        canSpawnOnEntities: false
      spawns:
      - StellarWallOozeNoOcclusion
    - settings:
        spawnOnPulse: true
        minAmount: 2
        maxAmount: 3
        minRange: 3
        maxRange: 4.5
      spawns:
      - StellarMobSlimeOoze
  - type: StellarTileConversion
    conversionMaxTicks: 0
    conversionTime: 0.33
    conversionChance: 0.75
    useVfx: false
    enabled: false
    conversionTiles:
    - StellarFloorOoze
    entityConversionDict:
      StellarWallWood: StellarWallOozeNoOcclusion
      StellarWallSteel: StellarWallOozeNoOcclusion
      StellarWallPlasteel: StellarWallOozeNoOcclusion
      StellarWallShuttle: StellarWallOozeNoOcclusion
      StellarWindowShuttle: StellarWallOozeNoOcclusion
      StellarWindowGlass: StellarWallOozeNoOcclusion
      StellarWindowGlassReinforced: StellarWallOozeNoOcclusion
      StellarWindowPlasma: StellarWallOozeNoOcclusion
      StellarWindowPlasmaReinforced: StellarWallOozeNoOcclusion
      StellarWindowUranium: StellarWallOozeNoOcclusion
      StellarWindowUraniumReinforced: StellarWallOozeNoOcclusion

- type: entity
  parent: StellarStructureBase
  id: StellarSciencBluespaceRift
  name: bluespace rift
  categories: [ ForkFiltered ]
  placement:
    mode: SnapgridCenter
  components:
  - type: Sprite
    drawdepth: Effects
    sprite: _ST/Effects/bluespaceportal.rsi
    layers:
    - state: vfx
      shader: unshaded
  - type: Appearance
  - type: AnimationPlayer
  - type: PointLight
    radius: 15
    energy: 1
    softness: 0.9
    color: "#468aff"
  - type: StellarLifetimeAnimation
  - type: ESTimedDespawn
    lifetime: 2.5
  - type: ESTimedDespawnSpriteFade
    fadeTime: 0.25
  - type: Tag
    tags:
    - HideContextMenu
  - type: Portal
    maxRandomRadius: 30
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.5
        density: 50
        mask:
        - MobMask
        layer:
        - MobLayer
      portalFixture:
        shape:
          !type:PhysShapeAabb
          bounds: "-1.25,-1.25,1.25,1.25"
        mask:
        - FullTileMask
        layer:
        - WallLayer
        hard: false
