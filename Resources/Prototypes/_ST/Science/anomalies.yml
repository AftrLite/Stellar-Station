    shootAmountMax: 6

- type: entity
  parent: StellarScienceAnomalyPowerfulBase
  id: StellarScienceAnomalyIonic
  description: Convalescent coils of energy, rippling with pure power.
  suffix: Ionic
  components:
  - type: StellarAnomaly
    triggerChance: 0.66
    soundPulse:
      path: /Audio/_ST/Science/science-anom-pulse-ionic.ogg
      params:
        variation: 0.077
  - type: Sprite
    layers:
    - state: shadow-anomaly
      shader: unshaded
    - state: electric-2
      offset: 0, 0.1
      shader: unshaded
  - type: PointLight
    radius: 2.0
    energy: 5.5
    softness: 4
    color: "#9cdfe4"
    castShadows: false
  - type: StellarAnomalyShoot
    shootable: StellarHitscanAnomalyIonic
    shootAmountMin: 6
    shootAmountMax: 8
  - type: EmpOnTrigger
    keysIn:
    - anom
    range: 10
    energyConsumption: 50000

- type: entity
  parent: StellarScienceAnomalyBase
  id: StellarScienceAnomalyIce
  description: An unbound concentration of rime and frost...
  suffix: Ice
  components:
  - type: Sprite
    layers:
    - state: shadow-anomaly
      shader: unshaded
    - state: ice
      shader: unshaded
  - type: PointLight
    radius: 2.0
    energy: 5.5
    softness: 4
    color: "#5b92c5"
    castShadows: false
  - type: StellarAnomalyShoot
    projectileSpeed: 10
    shootingMethod: Projectile
    shootable: StellarProjectileAnomalyIce
    shootAmountMin: 3
    shootAmountMax: 4
  - type: StellarAnomalyPulseSpawn
    entries:
    - settings:
        minAmount: 6
        maxAmount: 8
        maxRange: 3.5
        canSpawnOnEntities: false
      spawns:
      - IceCrust

- type: entity
  parent: StellarScienceAnomalyBase
  id: StellarScienceAnomalyFlame
  description: An unbound blaze, bright and wild...
  suffix: Flame
  components:
  - type: Sprite
    layers:
    - state: shadow-anomaly
      shader: unshaded
    - state: fire-1
      shader: unshaded
  - type: PointLight
    radius: 2.0
    energy: 5.5
    softness: 4
    color: "#e16146"
    castShadows: false
  - type: StellarAnomaly
    triggerChance: 0.5
  - type: StellarAnomalyShoot
    projectileSpeed: 4
    shootingMethod: Projectile
    shootable: StellarProjectileAnomalyFlame
    shootAmountMin: 3
    shootAmountMax: 4
  - type: ExplodeOnTrigger
    keysIn:
    - anom
  - type: Explosive
    explosionType: StellarFireExplosion
    maxIntensity: 1
    intensitySlope: 5
    totalIntensity: 10
    canCreateVacuum: false
    repeatable: true
    deleteAfterExplosion: false
  - type: IgnitionSource
    temperature: 800
    ignited: true
  - type: IgniteOnCollide
    fixtureId: fix1
    fireStacks: 1
  - type: DamageOnInteract
    damage:
      types:
        Heat: 10
    popupText: anomaly-component-contact-damage
  - type: DamageOnAttacked
    damage:
      types:
        Heat: 10

