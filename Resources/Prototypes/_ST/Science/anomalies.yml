  suffix: Apocryphal
  components:
  - type: Sprite
    layers:
    - state: shadow-anomaly
      shader: unshaded
    - state: shadow-2
      offset: 0, 0.1
      shader: unshaded
  - type: PointLight
    radius: 2.0
    energy: 5.5
    softness: 4
