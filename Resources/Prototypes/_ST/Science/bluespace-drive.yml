### CABLES DECOR
- type: entity
  parent: StellarStructureBase
  id: StellarScienceDriveCables
  name: BSD cables
  placement:
    mode: SnapgridCenter
  categories: [ ForkFiltered ]
  components:
  - type: StellarBluespaceDrivePart
  - type: Physics
    canCollide: false
  - type: Transform
    noRot: true
  - type: Sprite
    sprite: _ST/Tileset/Science/bluespace-drive-cables.rsi
    offset: 0, 0.625
    noRot: true
    layers:
    - state: base
      offset: -1.33, 0
    - state: base
      scale: -1, 1
      offset: 1.298, 0
    - state: wires-left
      offset: -1.33, 0
      sprite: _ST/Tileset/Science/bluespace-drive-cables.rsi
    - state: wires-right
      scale: -1, 1
      offset: 1.298, 0
      sprite: _ST/Tileset/Science/bluespace-drive-cables.rsi
  - type: Tag
    tags:
    - HideContextMenu
