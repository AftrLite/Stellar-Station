### COMPUTER CONSOLE
- type: entity
  parent: StellarStructureBase
  id: StellarScienceDriveComputer
  name: BSD control console
  description: LOREM IPSUM # TODO: Description
  categories: [ ForkFiltered ]
  components:
  - type: StellarBluespaceDriveConsole
  - type: StellarBluespaceDrivePart
    soundCharge:
      path: /Audio/_ST/Science/science-bsd-charge.ogg
      params:
        variation: 0.077
        volume: -2
  - type: ApcPowerReceiver
    powerLoad: 20
  - type: ExtensionCableReceiver
  - type: DoAfter
  - type: InteractionOutline
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.2,-0.01,0.1,1.25"
        density: 1000
        mask:
        - MachineMask
        layer:
        - GlassAirlockLayer
  - type: Sprite
    sprite: _ST/Tileset/Science/bluespace-drive-computer.rsi
    offset: 0, 0.53125
    drawdepth: Mobs
    noRot: true
    layers:
    - state: base

### DRIVE CORE
- type: entity
  parent: StellarStructureBase
  id: StellarScienceDriveCore
  name: BSD core
  placement:
    mode: SnapgridCenter
  categories: [ ForkFiltered ]
  components:
  - type: StellarOverchargeable
    requiredOvercharge: StellarOverchargeBluespace
  - type: StellarBluespaceDriveCore
  - type: DoAfter
  - type: InteractionOutline
  - type: Physics
  - type: Transform
    noRot: true
  - type: Sprite
    sprite: _ST/Tileset/Science/bluespace-drive-core.rsi
    offset: 0, 0.78125
    drawdepth: Mobs
    noRot: true
    layers:
    - state: base
    - state: active
      offset: 0, 0.25
      sprite: _ST/Tileset/Science/bluespace-drive-core-vfx.rsi
      shader: unshaded
      map: [ "unshaded" ]
    - state: glow
      shader: unshaded
      visible: false
      map: [ "overcharge" ]
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.StellarBluespaceDriveVisuals.Visuals:
        unshaded:
          1: { state: charge-1 }
          2: { state: charge-2 }
          3: { state: charge-3 }
          4: { state: charge-4 }
          Ready: { state: charge-4 }
          Active: { state: active }
      enum.OverchargeVisuals.Visuals:
        overcharge:
          Disabled: { visible: false }
          Overcharged: { visible: true, state: glow }
          Hypercharged: { visible: true, state: glow-hyper }
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.9,0.1,0.9,1.55"
        density: 1000
        mask:
        - MachineMask
        layer:
        - GlassAirlockLayer
  - type: PointLight
    enabled: true
    castShadows: false
    radius: 3
    energy: 5
    color: "#5292FFFF"

