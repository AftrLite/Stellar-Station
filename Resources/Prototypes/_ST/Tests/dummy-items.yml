# THESE DUMMY ITEMS EXIST AS A PLACEHOLDER FOR THE CONVENIENCE OF MAPPING.

- type: entity
  abstract: true
  parent: StellarStructureBase
  id: StellarMapDummy
  name: dummy item
  suffix: MAPPING ONLY
  categories: [ ForkFiltered ]
  components:
  - type: InteractionOutline
  - type: Sprite
    sprite: _ST/dummy-item.rsi
    layers:
    - state: base
    drawdepth: Mobs
    noRot: true
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.35
        mask:
        - LargeMobMask
        layer:
        - WallLayer

