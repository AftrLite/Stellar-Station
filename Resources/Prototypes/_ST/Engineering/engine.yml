- type: entity
  id: StellarEngineContactPad
  name: contact pad
  placement:
    mode: SnapgridCenter
  categories: [ ForkFiltered ]
  components:
  - type: StellarEnginePart
  - type: StellarEngineFireSource
  - type: InteractionOutline
  - type: Clickable
  - type: Transform
    noRot: true
  - type: Sprite
    sprite: _ST/Tileset/Engineering/engine-tuner-contactplate.rsi
    offset: 0, 0.375
    noRot: true
    layers:
    - state: base

- type: entity
  id: StellarEngineCables
  name: engine cable cluster
  placement:
    mode: SnapgridCenter
  categories: [ ForkFiltered ]
  components:
  - type: Physics
    canCollide: false
  - type: Transform
    noRot: true
  - type: Sprite
    sprite: _ST/Tileset/Engineering/engine-cables-lower.rsi
    noRot: true
    layers:
    - state: base
      offset: -2.375, -0.305
    - state: base
      scale: -1, 1
      offset: 2.3475, -0.305
    - state: base
      offset: -1.31, 3
      sprite: _ST/Tileset/Engineering/engine-cables-upper.rsi
    - state: base
      scale: -1, 1
      offset: 1.28, 3
      sprite: _ST/Tileset/Engineering/engine-cables-upper.rsi

- type: entity
  id: StellarEngineCablesElectrifiedOverlay
  parent: StellarStructureBase
  placement:
    mode: SnapgridCenter
  categories: [ ForkFiltered ]
  components:
  - type: Physics
  - type: Sprite
    sprite: _ST/Tileset/Engineering/engine-cables-lower.rsi
    noRot: true
    layers:
    - state: zap
      offset: -2.375, -0.305
    - state: zap
      scale: -1, 1
      offset: 2.3475, -0.305
    - state: zap
      offset: -1.31, 3
      sprite: _ST/Tileset/Engineering/engine-cables-upper.rsi
    - state: zap
      scale: -1, 1
      offset: 1.28, 3
      sprite: _ST/Tileset/Engineering/engine-cables-upper.rsi
  - type: StepTrigger
    requiredTriggeredSpeed: 0
    intersectRatio: 0.1
  - type: ESTimedDespawnSpriteFade
    fadeTime: 0.5
  - type: AnimationPlayer
  - type: ESTimedDespawn
    lifetime: 6.9 # Ayyy
  - type: StellarEngineWire
    throwSpeed: 10
    throwRange: 15
    damage:
      types:
        Shock: 20
        Heat: 10
  - type: TileEntityEffect
    effects:
    - !type:Flammable
      multiplier: 3
      multiplierOnExisting: 0.1
    - !type:Ignite
  - type: Fixtures #  WHY STOP AT ONE FIXTURE WHEN WE CAN HAVE SEVEN? THERE ARE NO RULES HERE. BEHOLD MY WORKS, YE MIGHTY, AND DESPAIR.
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "2.52,0.65,-2.58,0.25"
        layer:
        - SlipLayer
        mask:
        - ItemMask
        hard: False
      fix2:
        shape:
          !type:PhysShapeAabb
          bounds: "-2.25,0.25,-2.58,-0.75"
        layer:
        - SlipLayer
        mask:
        - ItemMask
        hard: False
      fix3:
        shape:
          !type:PhysShapeAabb
          bounds: "2.22,0.25,2.52,-0.75"
        layer:
        - SlipLayer
        mask:
        - ItemMask
        hard: False
      fix4:
        shape:
          !type:PhysShapeAabb
          bounds: "0.35,3.25,2,3.1"
        layer:
        - SlipLayer
        mask:
        - ItemMask
        hard: False
      fix5:
        shape:
          !type:PhysShapeAabb
          bounds: "-2,3.25,-0.38,3.1"
        layer:
        - SlipLayer
        mask:
        - ItemMask
        hard: False
      fix6:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.7,2,-0.38,3.1"
        layer:
        - SlipLayer
        mask:
        - ItemMask
        hard: False
      fix7:
        shape:
          !type:PhysShapeAabb
          bounds: "0.35,2,0.65,3.1"
        layer:
        - SlipLayer
        mask:
        - ItemMask
        hard: False
  - type: Tag
    tags:
    - HideContextMenu
