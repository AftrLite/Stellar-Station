- type: stellarCoopEmote
  id: StellarCoopEmoteHandshake
  name: stellar-emote-handshake-name
  popUpRequest: stellar-emote-handshake-request
  popUpSuccess: stellar-emote-handshake-success
  vfxEntity: StellarSocialVisualsHandshake
  icon: { sprite: /Textures/_ST/Icons/interaction-radial-icons.rsi, state: handshake }
  emoteSound:
    path: /Audio/_ST/Misc/emote-handshake.ogg
    params:
      variation: 0.05

