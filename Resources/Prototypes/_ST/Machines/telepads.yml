- type: entity
  parent: StellarStructureBase
  id: StellarRecyclerTelepad
  name: chute output pad
  description: A pad for marking where the station's recycler chutes dump their contents.
  categories: [ ForkFiltered ]
  components:
  - type: StellarChuteDestination
#  - type: InteractionOutline
  - type: Physics
    bodyType: Static
    canCollide: false
  - type: Transform
    anchored: true
    noRot: true
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.45,-0.45,0.45,0.00"
        density: 190
        mask:
        - MachineMask
  - type: Sprite
    drawdepth: HighFloorObjects
    noRot: true
    sprite: _ST/Tileset/Machines/telepad.rsi
    layers:
    - state: pad-recycler
