#################### THE LIBRARIAN
- type: entity
  id: StellarMobDecorApocryphalLibrarian
  name: The Librarian
  placement:
    mode: SnapgridCenter
  categories: [ ForkFiltered ]
  components:
  - type: Transform
    noRot: true
  - type: Sprite
    offset: 0, 1
    sprite: _ST/Mobs/Apocryphal/librarian-extras.rsi
    noRot: true
    drawdepth: Mobs
    layers:
    - state: base-underlay
      offset: 0, 0.75
      sprite: _ST/Mobs/Apocryphal/librarian.rsi
    - state: shadow-left
      offset: -0.5, -1
    - state: shadow-right
      offset: 0.5, -1
    - state: base
      offset: 0, 0.75
      sprite: _ST/Mobs/Apocryphal/librarian.rsi
    - state: eye
      offset: 0, -0.5
      shader: unshaded
  - type: AmbientSound
    volume: 0
    range: 20
    sound:
      path: /Audio/_ST/Music/Mono/curious_gods.ogg
  - type: PointLight
    radius: 2
    energy: 6
    color: "#35d9ba"
  - type: LightBehaviour
    behaviours:
    - !type:RandomizeBehaviour
      id: fade_out
      interpolate: Cubic
      minDuration: 0.5
      maxDuration: 1
      startValue: 7
      endValue: 5
      property: Energy
      isLooped: true
      enabled: true
    - !type:FadeBehaviour
      id: fade_out
      maxDuration: 4.0
      startValue: 6.0
      endValue: 4.0
      isLooped: true
      enabled: true
      reverseWhenFinished: true

