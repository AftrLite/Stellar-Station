#################### IDLE MOB BASE
- type: entity
  abstract: true
  parent: [ SimpleSpaceMobBase, BaseMobAnimal ]
  id: StellarMobApocryphalBase
  categories: [ ForkFiltered, HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _ST/Mobs/Apocryphal/small-fella-handy.rsi
    drawdepth: Mobs
    layers:
    - state: unshaded
      shader: unshaded
  - type: NpcFactionMember
    factions:
    - Passive
  - type: HTN
    constantlyReplan: false
    rootTask:
      task: IdleCompound
  - type: Physics
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.35
        density: 5
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: MovementSpeedModifier
    baseWalkSpeed : 2.5
    baseSprintSpeed : 5

# TRANSPARENT VERSION SPAWNER
- type: entity
  parent: MarkerBase
  id: StellarSpawnMobApocryphalGhost
  name: Spawner - Apocryphal Ghosts
  categories: [ ForkFiltered ]
  components:
  - type: Sprite
    layers:
    - state: green
    - state: ai
  - type: ConditionalSpawner
    prototypes:
    - StellarMobApocryphalGazer
    - StellarMobApocryphalWanderer
    - StellarMobApocryphalWatcher
    - StellarMobApocryphalPhalange
    - StellarMobApocryphalPhalangeSwole
    - StellarMobApocryphalPhalangeTendrils
    - StellarMobApocryphalPhalangeManyTendrils
    - StellarMobApocryphalUlna

