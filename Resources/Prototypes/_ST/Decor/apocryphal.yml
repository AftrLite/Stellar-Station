- type: entity
  parent: StellarStructureBase
  id: StellarDecorApocryphalPillar
  name: profane pillar
  categories: [ ForkFiltered ]
  components:
  - type: Sprite
    sprite: _ST/Tileset/Decor/Misc/apocryphal.rsi
    offset: 0, 0.25
    layers:
    - state: pillar
    drawdepth: Mobs
    noRot: true
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.35
        mask:
        - LargeMobMask
        layer:
        - WallLayer

