- type: entity
  parent: StellarMuzzleFlashBase
  id: StellarMuzzleFlashKinetic
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _ST/Projectiles/Guns/base.rsi
  - type: PointLight
    color: "#db812a"
    radius: 3
    energy: 3.4
    mask: /Textures/_ST/LightMasks/cone-rotated.png
    enabled: true
    autoRot: true
    castShadows: false
    netsync: false
  - type: Tag
    tags:
    - HideContextMenu

- type: entity
  parent: StellarHitscanVisualsBase
  id: StellarHitscanKinetic
  categories: [ HideSpawnMenu ]
  components:
  - type: HitscanBasicRaycast
    collisionMask: BulletImpassable
  - type: HitscanBasicDamage
    damage:
      types:
        Slash: 10
  - type: StellarGunHitscan
    collisionMask: BulletImpassable
    lightColor: "#db812a"
    unshaded: false

- type: entity
  parent: StellarHitscanKinetic
  id: StellarHitscanKineticSpread
  categories: [ HideSpawnMenu ]
  components:
  - type: HitscanBasicRaycast
    collisionMask: BulletImpassable
  - type: HitscanBasicDamage
    damage:
      types:
        Slash: 10
  - type: StellarGunHitscan
    collisionMask: BulletImpassable
    lightColor: "#db812a"
    unshaded: false
