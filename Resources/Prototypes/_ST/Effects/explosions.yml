- type: explosion
  id: StellarDefault
  damagePerIntensity:
    types:
      Heat: 5
      Blunt: 5
      Piercing: 5
  temperature: 800
  tileBreakChance: [0, 0.5, 1]
  tileBreakIntensity: [0, 10, 30]
  tileBreakRerollReduction: 20
  texturePath: /Textures/_ST/Effects/explosion-tile.rsi
  lightColor: "#000000"
  fireColor: "#b60034"
  fireStates: 1

- type: explosion
  id: StellarFireExplosion
  damagePerIntensity:
    types:
      Heat: 1
      Blunt: 2
  texturePath: /Textures/_ST/Effects/explosion-tile.rsi
  lightColor: "#000000"
  fireColor: "#b60034"
  fireStates: 1
  fireChance: 0.8
  minFireLevel: 1
  maxFireLevel: 3
  temperature: 1500

- type: explosion
  id: StellarDemolition
  damagePerIntensity:
    types:
      Heat: 3
      Blunt: 3
      Piercing: 3
      Structural: 50
  temperature: 800
  tileBreakChance: [ 0, 0.5, 1 ]
  tileBreakIntensity: [ 0, 10, 30 ]
  tileBreakRerollReduction: 20
  texturePath: /Textures/_ST/Effects/explosion-tile.rsi
  lightColor: "#000000"
  fireColor: "#b60034"
  fireStates: 1

- type: entity
  id: StellarExplosionDefault
  categories: [ HideSpawnMenu ]
  components:
  - type: StellarShockwave
    duration: 0.75
  - type: Sprite
    drawdepth: Effects
    noRot: true
    loop: false
    sprite: _ST/Effects/explosion.rsi
    layers:
    - state: vfx
      shader: unshaded
  - type: TimedDespawn
    lifetime: 0.9
  - type: Appearance
  - type: AnimationPlayer
  - type: PointLight
    radius: 7
    energy: 20
    falloff: 2
    color: "#bc4500"
    netsync: false
  - type: LightFade
    duration: 0.9

