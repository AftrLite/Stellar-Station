- type: entity
  id: StellarProjectileBase
  abstract: true
  categories: [ HideSpawnMenu ]
  components:
  - type: StellarProjectileAnimation
  - type: Reflective
  - type: Clickable
  - type: Sprite
    noRot: false
  - type: Physics
    bodyType: Dynamic
  - type: TileFrictionModifier
    modifier: 0
  - type: Fixtures
    fixtures:
      projectile:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.2,-0.2,0.2,0.3"
        hard: false
        mask:
        - Impassable
        - BulletImpassable
  - type: Projectile
    damage:
      types:
        Piercing: 1
    soundHit:
      path: /Audio/_ST/Hits/hit-generic.ogg
      params:
        variation: 0.1
  - type: Appearance
  - type: AnimationPlayer
  - type: ESTimedDespawn
    lifetime: 1.2
  - type: ESTimedDespawnSpriteFade
    fadeTime: 0.075
  - type: Tag
    tags:
    - HideContextMenu

- type: entity
  id: StellarProjectileImpactBase
  categories: [ HideSpawnMenu ]
  components:
  - type: TimedDespawn
    lifetime: 0.5
  - type: Sprite
    drawdepth: Effects
  - type: EffectVisuals
  - type: Tag
    tags:
    - HideContextMenu
