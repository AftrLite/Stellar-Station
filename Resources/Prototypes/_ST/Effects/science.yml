- type: entity
  id: StellarEffectSensorTerminalPopup
  categories: [ HideSpawnMenu ]
  components:
  - type: StellarDeleteOnAnimate
  - type: Transform
  - type: TimedDespawn
    lifetime: 40
  - type: Sprite
    drawdepth: Effects
    sprite: _ST/Icons/radial-icons-sensortower.rsi
    layers:
    - state: 1
      visible: false
  - type: Appearance
  - type: AnimationPlayer
  - type: Tag
    tags:
    - HideContextMenu
  - type: PointLight
    color: "#d458f4"
    radius: 2
    energy: 3
    enabled: true
    castShadows: false
    netsync: false

- type: entity
  id: StellarEffectAnomalyCodePopup
  categories: [ HideSpawnMenu ]
  components:
  - type: StellarDeleteOnAnimate
  - type: Transform
  - type: Sprite
    drawdepth: Effects
    sprite: _ST/Icons/icons-generic.rsi
    layers:
    - state: check
      visible: false
  - type: Appearance
  - type: AnimationPlayer
  - type: Tag
    tags:
    - HideContextMenu

- type: entity
  id: StellarEffectSciencePulse
  categories: [ HideSpawnMenu ]
  components:
  - type: Transform
    noRot: true
    anchored: false
  - type: TimedDespawn
    lifetime: 2.025
  - type: Sprite
    netsync: false
    drawdepth: Effects
    layers:
    - sprite: _ST/Effects/science-pulse.rsi
      state: vfx
      shader: unshaded
  - type: PointLight
    color: "#9052bc"
    radius: 1.75
    energy: 35
    castShadows: false
  - type: LightBehaviour
    behaviours:
    - !type:FadeBehaviour
      interpolate: Linear
      minDuration: 2.025
      maxDuration: 2.025
      startValue: 0.1
      endValue: 35
      property: Energy
      enabled: true
      isLooped: true
      reverseWhenFinished: true
  - type: Tag
    tags:
    - HideContextMenu
