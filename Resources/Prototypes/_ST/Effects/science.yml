- type: entity
  id: StellarEffectSensorTerminalPopup
  categories: [ HideSpawnMenu ]
  components:
  - type: StellarDeleteOnAnimate
  - type: Transform
  - type: TimedDespawn
    lifetime: 40
  - type: Sprite
    drawdepth: Effects
    sprite: _ST/Icons/radial-icons-sensortower.rsi
    layers:
    - state: 1
      visible: false
  - type: Appearance
  - type: AnimationPlayer
  - type: Tag
    tags:
    - HideContextMenu
  - type: PointLight
    color: "#d458f4"
    radius: 2
    energy: 3
    enabled: true
    castShadows: false
    netsync: false

- type: entity
