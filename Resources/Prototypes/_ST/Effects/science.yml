  - type: Transform
  - type: Sprite
    drawdepth: Effects
    sprite: _ST/Icons/radial-icons-abe.rsi
    layers:
    - state: 1
      visible: false
  - type: Appearance
  - type: AnimationPlayer
  - type: Tag
    tags:
    - HideContextMenu
