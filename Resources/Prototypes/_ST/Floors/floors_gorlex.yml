## FLOORING
- type: tile
  id: StellarFloorGorlexDottedBase
  editorHidden: false
  name: base gorlex floor
  sprite: /Textures/_ST/Tileset/Floor/Gorlex/gorlex-dotted-base.png
  baseTurf: Plating
  isSubfloor: false
  deconstructTools: [ Prying ]
  footstepSounds:
    collection: FootstepFloor
  itemDrop: FloorTileItemSteel
  heatCapacity: 10000

- type: tile
  parent: StellarFloorGorlexDottedBase
  id: StellarFloorGorlexDottedMono
  name: mono gorlex floor
  sprite: /Textures/_ST/Tileset/Floor/Gorlex/gorlex-dotted-mono.png

- type: tile
  parent: StellarFloorGorlexDottedBase
  id: StellarFloorGorlexDottedDiamond
  name: diamond-grip gorlex floor
  sprite: /Textures/_ST/Tileset/Floor/Gorlex/gorlex-diamond.png

- type: tile
  id: StellarFloorGorlexPlating
  editorHidden: false
  name: gorlex plating
  sprite: /Textures/_ST/Tileset/Floor/Gorlex/gorlex-plating.png
  baseTurf: Lattice
  isSubfloor: true
  footstepSounds:
    collection: FootstepPlating
  friction: 1.5
  heatCapacity: 10000


